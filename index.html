<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU Scheduler Lab</title>
<style>body{font:16px system-ui;background:#101827;color:#edf5ff;max-width:900px;margin:40px auto;padding:0 18px}input,select,button{padding:10px;border-radius:8px;background:#1b2b43;color:inherit;border:1px solid #405775}button{cursor:pointer}.panel{background:#19263b;padding:16px;border-radius:12px;margin:14px 0}.bar{display:flex;height:54px;overflow:hidden;border-radius:8px}.seg{display:grid;place-items:center;background:#266b86;border-right:2px solid #101827;min-width:32px;font-size:13px}.seg:nth-child(2n){background:#6655a7}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #35445a}</style>
<h1>CPU Scheduler Lab</h1><p>Compare FCFS and non-preemptive SJF. All processes arrive at time zero.</p>
<div class="panel"><label>Processes (name:burst) <input id="jobs" value="P1:5,P2:3,P3:2" size="30"></label><select id="policy"><option>FCFS</option><option>SJF</option></select><button id="run">Schedule</button></div>
<div class="panel"><h3 id="avg">Timeline</h3><div class="bar" id="bar"></div><p id="ticks"></p><table><thead><tr><th>Process</th><th>Start</th><th>Finish</th><th>Waiting</th><th>Turnaround</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
document.querySelector('#run').onclick=()=>{const jobs=document.querySelector('#jobs').value.split(',').map(x=>{const p=x.trim().split(':');return {name:p[0],burst:Number(p[1])};});if(!jobs.length||jobs.some(x=>!x.name||!Number.isFinite(x.burst)||x.burst<=0)){alert('Use entries like P1:5,P2:3.');return;}const policy=document.querySelector('#policy').value;if(policy==='SJF')jobs.sort((a,b)=>a.burst-b.burst);let t=0,wait=0,rows='';document.querySelector('#bar').innerHTML=jobs.map(j=>{const start=t;t+=j.burst;wait+=start;rows+='<tr><td>'+j.name+'</td><td>'+start+'</td><td>'+t+'</td><td>'+start+'</td><td>'+t+'</td></tr>';return '<div class="seg" style="flex:'+j.burst+'">'+j.name+'</div>';}).join('');document.querySelector('#rows').innerHTML=rows;document.querySelector('#ticks').textContent='Time: 0 to '+t;document.querySelector('#avg').textContent=policy+' | Average waiting time: '+(wait/jobs.length).toFixed(2);};document.querySelector('#run').click();
</script></html>
